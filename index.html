<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6D3BC0">
<title>REDSUN | لیست محصولات</title>
<style>

@font-face{
  font-family:'IRANSansX';
  src:url('IRANSansX-Black.ttf') format('truetype');
  font-weight:900;
  font-style:normal;
  font-display:swap;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:'IRANSansX',Tahoma,Arial,sans-serif;
}
body{
  color:#241833;
  background:
    radial-gradient(circle at 15% 12%,rgba(173,120,255,.34),transparent 28%),
    radial-gradient(circle at 88% 8%,rgba(116,80,220,.28),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(216,184,255,.38),transparent 36%),
    linear-gradient(145deg,#f7f2ff 0%,#eee6fb 48%,#f9f7ff 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}
body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(26px);
  pointer-events:none;
  z-index:-1;
}
body::before{
  width:240px;height:240px;
  top:-70px;left:-70px;
  background:rgba(126,70,220,.24);
}
body::after{
  width:280px;height:280px;
  right:-110px;bottom:-90px;
  background:rgba(184,128,255,.22);
}
button,input{font:inherit;font-family:'IRANSansX',Tahoma,Arial,sans-serif}
button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:18px}

.header{
  position:relative;
  overflow:hidden;
  color:#fff;
  border:1px solid rgba(255,255,255,.46);
  border-radius:24px;
  padding:24px 22px;
  margin-bottom:16px;
  background:
    linear-gradient(135deg,rgba(102,51,170,.88),rgba(123,63,190,.66)),
    rgba(255,255,255,.14);
  backdrop-filter:blur(22px) saturate(165%);
  -webkit-backdrop-filter:blur(22px) saturate(165%);
  box-shadow:
    0 18px 45px rgba(84,42,145,.24),
    inset 0 1px 0 rgba(255,255,255,.30),
    0 0 32px rgba(143,82,230,.18);
}
.header::after{
  content:"";
  position:absolute;
  width:170px;height:170px;
  left:-45px;top:-70px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  filter:blur(2px);
}
.brand{
  position:relative;
  z-index:1;
  font-size:31px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 3px 16px rgba(55,19,101,.32);
}
.subtitle{
  position:relative;
  z-index:1;
  margin-top:6px;
  font-size:14px;
  opacity:.96;
}

.card{
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.82);
  border-radius:22px;
  padding:17px;
  margin-bottom:15px;
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:
    0 14px 38px rgba(91,42,134,.11),
    inset 0 1px 0 rgba(255,255,255,.95);
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
  color:#4f3470;
}
input{
  width:100%;
  border:1px solid rgba(108,72,153,.22);
  border-radius:14px;
  padding:13px;
  background:rgba(255,255,255,.70);
  color:#241833;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.90);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
input:focus{
  border-color:#8e5bd1;
  box-shadow:0 0 0 4px rgba(142,91,209,.14),0 0 24px rgba(142,91,209,.10);
}
.rateRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:end;
}
.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.btn{
  border-radius:14px;
  padding:11px 15px;
  font-weight:700;
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.btn:active{transform:scale(.98)}
.primary{
  border:1px solid rgba(255,255,255,.30);
  color:#fff;
  background:linear-gradient(135deg,#6d3bc0,#8d59d4);
  box-shadow:0 8px 20px rgba(109,59,192,.22),0 0 18px rgba(149,91,230,.15);
}
.primary:hover{
  box-shadow:0 10px 26px rgba(109,59,192,.28),0 0 24px rgba(149,91,230,.20);
}
.secondary{
  color:#5b3382;
  border:1px solid rgba(109,72,153,.20);
  background:rgba(255,255,255,.58);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.90);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.danger{
  background:rgba(255,244,247,.82);
  color:#c62845;
  border:1px solid rgba(198,40,69,.20);
}
.small{padding:8px 11px;font-size:13px}
.editBtn{
  background:rgba(236,250,240,.82);
  color:#218838;
  border:1px solid rgba(33,136,56,.20);
}

.tableWrap{
  overflow:auto;
  border:1px solid rgba(255,255,255,.86);
  border-radius:18px;
  background:rgba(255,255,255,.30);
  backdrop-filter:blur(14px) saturate(150%);
  -webkit-backdrop-filter:blur(14px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85);
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}
th,td{
  padding:12px 10px;
  border-bottom:1px solid rgba(111,76,150,.12);
  text-align:right;
  white-space:nowrap;
}
th{
  background:rgba(113,69,170,.10);
  color:#4d316b;
  font-size:14px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
td{
  text-align:center;
  background:rgba(255,255,255,.34);
}
tbody tr:hover td{
  background:rgba(255,255,255,.54);
}
td.product{
  text-align:right;
  white-space:normal;
}
tr:last-child td{border-bottom:0}
.empty{text-align:center;color:#746783;padding:30px}

.modalBack{
  position:fixed;
  inset:0;
  background:rgba(55,28,83,.35);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:20;
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
}
.modalBack.show{display:flex}
.modal{
  width:min(460px,100%);
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.90);
  border-radius:24px;
  padding:21px;
  box-shadow:
    0 24px 70px rgba(71,34,106,.28),
    inset 0 1px 0 rgba(255,255,255,.95),
    0 0 35px rgba(137,79,214,.12);
  position:relative;
  backdrop-filter:blur(26px) saturate(175%);
  -webkit-backdrop-filter:blur(26px) saturate(175%);
}
.modal h2{
  margin:0 0 16px;
  color:#4f2878;
  font-size:20px;
}
.close{
  position:absolute;
  left:14px;
  top:10px;
  border:0;
  background:transparent;
  font-size:28px;
  color:#765d89;
}
.field{margin-bottom:13px}
.modalActions{
  display:flex;
  gap:8px;
  justify-content:flex-start;
  margin-top:16px;
}
.note{font-size:12px;color:#786c82;margin-top:6px}
.footer{text-align:center;color:#776a82;font-size:12px;padding:4px 0 15px}

@media(max-width:600px){
  .wrap{padding:10px}
  .header{padding:19px;border-radius:20px}
  .brand{font-size:26px}
  .rateRow{grid-template-columns:1fr}
  .actions .btn{flex:1}
  .card{border-radius:19px}
}

@media print{
  body{background:#fff;color:#111}
  body::before,body::after{display:none!important}
  .wrap{max-width:none;padding:0}
  .header{
    background:#fff;
    color:#111;
    box-shadow:none;
    border:0;
    padding:0 0 10px;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  .brand{color:#5b2a86;text-shadow:none}
  .subtitle{color:#555}
  .rateCard,.actions,.footer,.noPrint,.ops{display:none!important}
  .card{
    border:0;
    box-shadow:none;
    padding:0;
    background:#fff;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  .tableWrap{
    overflow:visible;
    border:1px solid #bbb;
    background:#fff;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  table{min-width:0;width:100%}
  th{background:#eee!important;color:#111}
  td{background:#fff!important}
  th,td{border-color:#bbb;color:#111}
}

/* ===== REDSUN Text Intro - CSS Only ===== */
.textSplash{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(151,96,225,.32),transparent 30%),
    linear-gradient(145deg,#21102f 0%,#3a1758 48%,#170b23 100%);
  animation:splashOut .65s ease 2.65s forwards;
}
.textSplashBox{
  text-align:center;
  color:#fff;
  padding:24px;
}
.textSplashFa{
  font-size:36px;
  font-weight:900;
  opacity:0;
  transform:translateY(16px);
  animation:introUp .6s ease .15s forwards;
}
.textSplashEn{
  margin-top:7px;
  font-size:28px;
  font-weight:900;
  letter-spacing:8px;
  color:#f4eaff;
  opacity:0;
  transform:translateY(16px);
  animation:introUp .6s ease .55s forwards;
}
.textSplashLine{
  width:0;
  height:2px;
  margin:16px auto 0;
  background:linear-gradient(90deg,transparent,#d6b8ff,transparent);
  box-shadow:0 0 12px rgba(214,184,255,.55);
  animation:introLine .65s ease .95s forwards;
}
.textSplashWelcome{
  margin-top:15px;
  font-size:15px;
  font-weight:700;
  color:#eadcff;
  opacity:0;
  animation:introFade .5s ease 1.3s forwards;
}
@keyframes introUp{
  to{opacity:1;transform:translateY(0)}
}
@keyframes introFade{
  to{opacity:1}
}
@keyframes introLine{
  to{width:220px}
}
@keyframes splashOut{
  0%{opacity:1;visibility:visible;pointer-events:auto}
  99%{opacity:0;visibility:visible;pointer-events:none}
  100%{opacity:0;visibility:hidden;pointer-events:none}
}
@media(max-width:600px){
  .textSplashFa{font-size:31px}
  .textSplashEn{font-size:24px;letter-spacing:6px}
}

</style>
</head>
<body>

<div class="textSplash" aria-hidden="true">
  <div class="textSplashBox">
    <div class="textSplashFa">ردسان</div>
    <div class="textSplashEn">REDSUN</div>
    <div class="textSplashLine"></div>
    <div class="textSplashWelcome">خوش آمدید</div>
  </div>
</div>

<div class="wrap">
  <header class="header">
    <div class="brand">REDSUN</div>
    <div class="subtitle">مدیریت و محاسبه قیمت محصولات</div>
  </header>

  <section class="card rateCard">
    <div class="rateRow">
      <div>
        <label for="rate">قیمت دلار به تومان</label>
        <input id="rate" type="number" inputmode="numeric" min="0" step="1" value="234000">
      </div>
      <button class="btn secondary" id="settingsBtn" type="button">⚙ تنظیمات رمز</button>
    </div>
    <div class="note">قیمت محصول = قیمت دلاری × نرخ دلار</div>
  </section>

  <section class="card">
    <div class="actions">
      <button class="btn primary" id="addBtn" type="button">＋ افزودن محصول</button>
      <button class="btn secondary" id="pdfBtn" type="button">↓ خروجی PDF لیست</button>
    </div>
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>ردیف</th><th>محصول</th><th>دلار</th><th>قیمت به تومان</th><th class="ops">عملیات</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none">محصولی ثبت نشده است.</div>
    </div>
  </section>
  <div class="footer">اطلاعات در همین مرورگر ذخیره می‌شود.</div>
</div>

<!-- Add/Edit -->
<div class="modalBack" id="productModal">
  <div class="modal">
    <button class="close" data-close="productModal" type="button">×</button>
    <h2 id="productTitle">افزودن محصول</h2>
    <div class="field">
      <label for="nameInput">نام محصول</label>
      <input id="nameInput" type="text" autocomplete="off">
    </div>
    <div class="field">
      <label for="usdInput">قیمت به دلار</label>
      <input id="usdInput" type="number" inputmode="decimal" min="0" step="0.001">
    </div>
    <div class="modalActions">
      <button class="btn primary" id="saveProduct" type="button">ثبت</button>
      <button class="btn secondary" data-close="productModal" type="button">انصراف</button>
    </div>
  </div>
</div>

<!-- Password -->
<div class="modalBack" id="passwordModal">
  <div class="modal">
    <button class="close" data-close="passwordModal" type="button">×</button>
    <h2>رمز عبور ویرایش</h2>
    <div class="field">
      <label for="passwordInput">رمز فعلی</label>
      <input id="passwordInput" type="password" inputmode="numeric" autocomplete="current-password">
    </div>
    <div class="modalActions">
      <button class="btn primary" id="passwordOk" type="button">تأیید</button>
      <button class="btn secondary" data-close="passwordModal" type="button">انصراف</button>
    </div>
  </div>
</div>

<!-- Delete -->
<div class="modalBack" id="deleteModal">
  <div class="modal">
    <button class="close" data-close="deleteModal" type="button">×</button>
    <h2>حذف محصول</h2>
    <div id="deleteMessage" style="line-height:1.9"></div>
    <div class="modalActions">
      <button class="btn danger" id="deleteOk" type="button">حذف</button>
      <button class="btn secondary" data-close="deleteModal" type="button">انصراف</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="modalBack" id="settingsModal">
  <div class="modal">
    <button class="close" data-close="settingsModal" type="button">×</button>
    <h2>تغییر رمز ویرایش</h2>
    <div class="field">
      <label for="oldPass">رمز فعلی</label>
      <input id="oldPass" type="password" inputmode="numeric" autocomplete="current-password">
    </div>
    <div class="field">
      <label for="newPass">رمز جدید</label>
      <input id="newPass" type="password" inputmode="numeric" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="repeatPass">تکرار رمز جدید</label>
      <input id="repeatPass" type="password" inputmode="numeric" autocomplete="new-password">
    </div>
    <div class="modalActions">
      <button class="btn primary" id="changePass" type="button">ثبت رمز جدید</button>
      <button class="btn secondary" data-close="settingsModal" type="button">انصراف</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const PRODUCTS_KEY = "redsun_products_v1";
const RATE_KEY = "redsun_rate_v1";
const PASS_KEY = "redsun_edit_password_v1";
const DEFAULT_RATE = 234000;
const DEFAULT_PASS = "1234";

const defaultProducts = [
  ["لامپ اشکی 7 وات",0.72],
  ["لامپ حبابی 9 وات",0.725],
  ["لامپ حبابی 12 وات",0.912],
  ["لامپ حبابی 15 وات",1.28],
  ["لامپ حبابی 20 وات",1.7],
  ["لامپ حبابی 25 وات",2.25],
  ["لامپ استوانه ای 25 وات",2.59],
  ["لامپ استوانه ای 30 وات",2.84],
  ["لامپ استوانه ای 40 وات",3.82],
  ["لامپ استوانه ای 50 وات",4.821],
  ["پنل توکار سایز شو 10وات",1.8],
  ["پنل توکار سایز شو 18 وات",2.714],
  ["پنل توکار سایز شو 24 وات",3.84],
  ["پنل توکار سایز شو 36 وات",5.908],
  ["پنل روکار 18وات",3.513],
  ["پنل روکار 24وات",4.872],
  ["پنل روکار 36 وات",6.74]
];

let products = loadProducts();
let editIndex = -1;
let pendingEditIndex = -1;
let deleteIndex = -1;

function loadProducts(){
  try{
    const raw = localStorage.getItem(PRODUCTS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) return parsed;
    }
  }catch(e){}
  return defaultProducts.map(x=>({name:x[0],usd:x[1]}));
}
function saveProducts(){ localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products)); }
function getRate(){ return Number($("rate").value) || 0; }
function formatNumber(n){ return Number(n).toLocaleString("fa-IR"); }
function esc(s){
  return String(s).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
function openModal(id){ $(id).classList.add("show"); }
function closeModal(id){ $(id).classList.remove("show"); }

function render(){
  const body = $("tbody");
  body.innerHTML = "";
  $("empty").style.display = products.length ? "none" : "block";

  products.forEach((p,i)=>{
    const price = Math.round(Number(p.usd) * getRate());
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>"+formatNumber(i+1)+"</td>"+
      '<td class="product">'+esc(p.name)+"</td>"+
      "<td>"+formatNumber(p.usd)+"</td>"+
      "<td>"+formatNumber(price)+"</td>"+
      '<td class="ops">'+
        '<button class="btn small secondary editBtn" type="button" data-i="'+i+'">ویرایش</button> '+
        '<button class="btn small danger deleteBtn" type="button" data-i="'+i+'">حذف</button>'+
      "</td>";
    body.appendChild(tr);
  });
}

function openAdd(){
  editIndex=-1;
  $("productTitle").textContent="افزودن محصول";
  $("nameInput").value="";
  $("usdInput").value="";
  openModal("productModal");
  setTimeout(()=>$("nameInput").focus(),50);
}

function openEdit(i){
  pendingEditIndex=i;
  $("passwordInput").value="";
  openModal("passwordModal");
  setTimeout(()=>$("passwordInput").focus(),50);
}

function showEditForm(i){
  editIndex=i;
  $("productTitle").textContent="ویرایش محصول";
  $("nameInput").value=products[i].name;
  $("usdInput").value=products[i].usd;
  openModal("productModal");
  setTimeout(()=>$("nameInput").focus(),50);
}

$("addBtn").addEventListener("click",openAdd);

$("saveProduct").addEventListener("click",()=>{
  const name=$("nameInput").value.trim();
  const usd=Number($("usdInput").value);
  if(!name){ alert("نام محصول را وارد کنید."); return; }
  if(!Number.isFinite(usd) || usd<0){ alert("قیمت دلار را درست وارد کنید."); return; }

  if(editIndex===-1) products.push({name:name,usd:usd});
  else products[editIndex]={name:name,usd:usd};

  saveProducts();
  render();
  closeModal("productModal");
});

$("tbody").addEventListener("click",e=>{
  const edit=e.target.closest(".editBtn");
  const del=e.target.closest(".deleteBtn");

  if(edit) openEdit(Number(edit.dataset.i));
  if(del){
    deleteIndex=Number(del.dataset.i);
    $("deleteMessage").textContent="آیا محصول «"+products[deleteIndex].name+"» حذف شود؟";
    openModal("deleteModal");
  }
});

$("passwordOk").addEventListener("click",()=>{
  const saved=localStorage.getItem(PASS_KEY) || DEFAULT_PASS;
  if($("passwordInput").value!==saved){
    alert("رمز عبور اشتباه است.");
    return;
  }
  closeModal("passwordModal");
  showEditForm(pendingEditIndex);
});

$("deleteOk").addEventListener("click",()=>{
  if(deleteIndex>=0){
    products.splice(deleteIndex,1);
    saveProducts();
    render();
  }
  deleteIndex=-1;
  closeModal("deleteModal");
});

$("settingsBtn").addEventListener("click",()=>{
  $("oldPass").value="";
  $("newPass").value="";
  $("repeatPass").value="";
  openModal("settingsModal");
  setTimeout(()=>$("oldPass").focus(),50);
});

$("changePass").addEventListener("click",()=>{
  const saved=localStorage.getItem(PASS_KEY) || DEFAULT_PASS;
  const old=$("oldPass").value;
  const np=$("newPass").value;
  const rp=$("repeatPass").value;

  if(old!==saved){ alert("رمز فعلی اشتباه است."); return; }
  if(!np){ alert("رمز جدید را وارد کنید."); return; }
  if(np!==rp){ alert("تکرار رمز جدید یکسان نیست."); return; }

  localStorage.setItem(PASS_KEY,np);
  closeModal("settingsModal");
  alert("رمز ویرایش با موفقیت تغییر کرد.");
});

$("rate").value = localStorage.getItem(RATE_KEY) || DEFAULT_RATE;
$("rate").addEventListener("input",()=>{
  localStorage.setItem(RATE_KEY,String(getRate()));
  render();
});

/* خروجی PDF: صفحه تمیز چاپ می‌شود و در پنجره چاپ گزینه Save as PDF دارد. */
$("pdfBtn").addEventListener("click",()=>{
  const popup=window.open("","_blank");
  if(!popup){
    alert("باز شدن پنجره جدید توسط مرورگر مسدود شده است. اجازه Pop-up را برای سایت فعال کنید.");
    return;
  }

  const rate=getRate();
  const rows=products.map((p,i)=>{
    const price=Math.round(Number(p.usd)*rate);
    return "<tr>"+
      "<td>"+formatNumber(i+1)+"</td>"+
      "<td>"+esc(p.name)+"</td>"+
      "<td>"+formatNumber(price)+"</td>"+
      "</tr>";
  }).join("");

  popup.document.open();
  popup.document.write(

  });
});
